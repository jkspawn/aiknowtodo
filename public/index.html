<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 12px; font-size: 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
    .id { color: #888; min-width: 2.5em; }
    .text { flex: 1; }
    .done .text { text-decoration: line-through; color: #888; }
    .time { font-size: 12px; color: #888; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>할 일</h1>
  <form id="add-form">
    <input id="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
    <button type="submit">추가</button>
  </form>
  <p id="error" class="error"></p>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById('list');
    const errorEl = document.getElementById('error');

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      return data;
    }

    function render(todos) {
      list.replaceChildren(...todos.map((todo) => {
        const li = document.createElement('li');
        if (todo.completed) li.className = 'done';

        const id = document.createElement('span');
        id.className = 'id';
        id.textContent = '#' + todo.id;

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = todo.text;

        li.append(id, text);
        if (todo.completed) {
          const time = document.createElement('span');
          time.className = 'time';
          time.textContent = '완료 ' + new Date(todo.completedAt).toLocaleString();
          li.append(time);
        } else {
          const btn = document.createElement('button');
          btn.textContent = '완료';
          btn.onclick = () => run(() => api('POST', `/api/todos/${todo.id}/complete`));
          li.append(btn);
        }
        return li;
      }));
    }

    async function run(action) {
      try {
        errorEl.textContent = '';
        await action();
        render(await api('GET', '/api/todos'));
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    document.getElementById('add-form').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('text');
      run(async () => {
        await api('POST', '/api/todos', { text: input.value });
        input.value = '';
      });
    };

    run(async () => {});
  </script>
</body>
</html>
